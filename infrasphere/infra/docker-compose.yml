services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infrasphere
      POSTGRES_PASSWORD: infrasphere
      POSTGRES_DB: infrasphere
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
    environment:
      APP_ENV: development
      APP_PORT: 8080
      DATABASE_URL: postgres://infrasphere:infrasphere@postgres:5432/infrasphere?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me
      ENCRYPTION_KEY: change-me-32-byte-key
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: debug
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"

  worker:
    build:
      context: ../backend
    command: ["/app/worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://infrasphere:infrasphere@postgres:5432/infrasphere?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      - backend

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres-data:

